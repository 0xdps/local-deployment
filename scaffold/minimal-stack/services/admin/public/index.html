<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stacklane Admin</title>
    <style>
      :root {
        --bg: #fff7ed;
        --fg: #1f2937;
        --line: #fed7aa;
        --accent: #c2410c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(160deg, #fff7ed, #fffbeb);
        color: var(--fg);
      }
      main {
        max-width: 760px;
        margin: 48px auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 24px;
        background: #ffffff;
      }
      button {
        background: var(--accent);
        color: white;
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        cursor: pointer;
      }
      pre {
        background: #111827;
        color: #e5e7eb;
        border-radius: 8px;
        padding: 12px;
      }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>Stacklane Admin</h1>
      <p>This route is served by the admin service through <code>/admin</code>.</p>
      <p>Go back to <a href="/">frontend</a>.</p>
      <button id="btn">Call /api/meta</button>
      <pre id="out">Click to fetch backend metadata.</pre>
    </main>
    <script>
      document.getElementById("btn").addEventListener("click", async () => {
        const out = document.getElementById("out");
        out.textContent = "Loading...";
        try {
          const res = await fetch("/api/meta");
          out.textContent = JSON.stringify(await res.json(), null, 2);
        } catch (err) {
          out.textContent = String(err);
        }
      });
    </script>
  </body>
</html>
