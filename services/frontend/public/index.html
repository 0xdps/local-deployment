<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Frontend</title>
    <style>
      :root {
        --bg: #f6f7fb;
        --fg: #1b2230;
        --card: #ffffff;
        --line: #d8deea;
        --accent: #0f766e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: radial-gradient(circle at 10% 10%, #dfe8ff, var(--bg));
        color: var(--fg);
      }
      main {
        max-width: 760px;
        margin: 48px auto;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 24px;
      }
      button {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        cursor: pointer;
      }
      pre {
        background: #0f172a;
        color: #e2e8f0;
        border-radius: 8px;
        padding: 12px;
        overflow: auto;
      }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>Frontend</h1>
      <p>This route is served by the frontend service through edge proxy.</p>
      <p>Open admin at <a href="/admin">/admin</a>.</p>
      <button id="btn">Call /api/hello</button>
      <pre id="out">Click the button to call backend API.</pre>
    </main>
    <script>
      document.getElementById("btn").addEventListener("click", async () => {
        const out = document.getElementById("out");
        out.textContent = "Loading...";
        try {
          const res = await fetch("/api/hello");
          out.textContent = JSON.stringify(await res.json(), null, 2);
        } catch (err) {
          out.textContent = String(err);
        }
      });
    </script>
  </body>
</html>
